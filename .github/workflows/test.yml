name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Version
        shell: bash
        run: bash Scripts/check_version.sh
      - name: Install
        working-directory: electron
        run: npm ci
      - name: Unit tests
        working-directory: electron
        run: npm test
      - name: Package
        shell: bash
        run: bash Scripts/make_electron.sh
