name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Version matches Info.plist
        run: bash Scripts/check_version.sh
      - name: Electron package
        run: bash Scripts/make_electron.sh
