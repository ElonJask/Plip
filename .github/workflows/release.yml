name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x86_64
            runner: macos-26-intel
          - name: windows-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag matches version
        shell: bash
        run: bash Scripts/check_version.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Package
        shell: bash
        run: bash Scripts/make_electron.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/Plip-v*.zip

  publish:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/Plip-v${version}-macos-arm64.zip"
          test -f "dist/Plip-v${version}-macos-x86_64.zip"
          test -f "dist/Plip-v${version}-windows-x64.zip"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Plip-v${version}-macos-arm64.zip" \
            "dist/Plip-v${version}-macos-x86_64.zip" \
            "dist/Plip-v${version}-windows-x64.zip" \
            --title "Plip ${version}" \
            --notes "$(cat <<EOF
          ## macOS

          - \`Plip-v${version}-macos-arm64.zip\`：Apple Silicon
          - \`Plip-v${version}-macos-x86_64.zip\`：Intel

          解压后将 Plip.app 移入「应用程序」，然后执行：

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Plip.app
          \`\`\`

          首次打开若提示辅助功能，请到「系统设置 → 隐私与安全性 → 辅助功能」允许 Plip。

          ## Windows

          - \`Plip-v${version}-windows-x64.zip\`：64 位

          解压后运行 Plip.exe。图标在任务栏通知区域，点击打开面板。Alt+Shift+M 静音。
          EOF
          )"
