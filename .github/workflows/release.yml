name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-26-intel
    env:
      ARCH: ${{ matrix.arch }}
      SKIP_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version
        run: bash Scripts/check_version.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Build archive
        run: bash Scripts/make_app.sh
      - name: Check archive
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          zip="artifacts/Plip-v${version}-macos-${ARCH}.zip"
          root="${RUNNER_TEMP}/plip-check"
          rm -rf "$root"
          ditto -x -k "$zip" "$root"
          bin="$root/Plip.app/Contents/MacOS/Plip"
          test -f "$bin"
          test "$(lipo -archs "$bin")" = "$ARCH"
          codesign --verify --deep --strict "$root/Plip.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/Plip-v*-macos-${{ matrix.arch }}.zip

  publish:
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/Plip-v${version}-macos-arm64.zip"
          test -f "dist/Plip-v${version}-macos-x86_64.zip"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Plip-v${version}-macos-arm64.zip" \
            "dist/Plip-v${version}-macos-x86_64.zip" \
            --title "Plip ${version}" \
            --notes "$(cat <<EOF
          ## macOS

          - \`Plip-v${version}-macos-arm64.zip\`：Apple Silicon
          - \`Plip-v${version}-macos-x86_64.zip\`：Intel

          解压后将 Plip.app 移入「应用程序」，然后执行：

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Plip.app
          \`\`\`

          安装包为临时签名。临时签名不能登记开机自启，需要 Developer ID 签名，并且应用位于 /Applications/Plip.app。

          ## Windows

          尚未提供。
          EOF
          )"
