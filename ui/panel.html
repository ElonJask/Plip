<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light;
    --ink: #1f1f1f;
    --quiet: #6b6b6b;
    --line: rgba(0,0,0,.08);
    --chip: rgba(0,0,0,.06);
    --blue: #2e73f2;
    --warn: #b85c0d;
    --exit: #c7291f;
    --alert: #f27347;
    --font: -apple-system, "Segoe UI", sans-serif;
    --text: 13px;
    --meta: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 400 var(--text)/1.3 var(--font);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
  }
  button, input { font: inherit; }
  .panel {
    width: 280px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .header, .row, .volume, .footer { padding: 0 14px; }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding-top: 8px;
    padding-bottom: 4px;
  }
  .name { font-weight: 600; }
  .pack {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    border: 0;
    background: var(--chip);
    color: var(--ink);
    border-radius: 999px;
    padding: 4px 8px;
    font-weight: 500;
    cursor: pointer;
  }
  .pack span { white-space: nowrap; }
  .chev { font-size: var(--meta); color: var(--quiet); font-weight: 500; }
  .menu {
    position: absolute;
    right: 14px;
    top: 42px;
    width: 210px;
    max-height: 240px;
    overflow: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 4px;
    z-index: 2;
  }
  .menu button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 7px;
    padding: 7px 8px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }
  .menu button[aria-current="true"] { background: var(--chip); }
  .hidden { display: none; }
  .alert {
    width: 100%;
    border: 0;
    background: var(--alert);
    color: #fff;
    font-weight: 500;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
  }
  .volume { display: flex; align-items: center; gap: 8px; padding-top: 6px; padding-bottom: 6px; }
  .speaker { width: 14px; color: var(--quiet); flex: none; }
  input[type="range"] { flex: 1; accent-color: var(--blue); height: 16px; }
  .percent {
    width: 36px;
    text-align: right;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--quiet);
  }
  .row { min-height: 32px; display: flex; align-items: center; gap: 8px; }
  .key {
    font-size: var(--meta);
    font-weight: 500;
    background: var(--chip);
    color: var(--quiet);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .switch { margin-left: auto; width: 32px; height: 18px; border: 0; border-radius: 999px; background: #d0d0d4; position: relative; cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; top: 2px; left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .12s ease; }
  .switch[aria-checked="true"] { background: #34c759; }
  .switch[aria-checked="true"]::after { left: 16px; }
  .hair { height: 1px; background: var(--line); margin: 4px 14px; }
  .note, .warn, .link { font-size: var(--meta); padding: 0 14px 8px; }
  .note { color: var(--quiet); }
  .warn { color: var(--warn); }
  .link { border: 0; background: transparent; color: var(--ink); font-weight: 500; cursor: pointer; }
  .footer {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding-top: 2px;
    padding-bottom: 8px;
  }
  .action {
    border: 0;
    background: transparent;
    color: var(--ink);
    display: flex;
    gap: 6px;
    align-items: center;
    min-height: 28px;
    padding: 0;
    font-weight: 500;
    cursor: pointer;
  }
  .action.exit { margin-left: auto; color: var(--exit); }
  .glyph { width: 12px; text-align: center; color: var(--quiet); font-weight: 500; }
  .action.exit .glyph { color: var(--exit); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="name">Plip</div>
      <button class="pack" id="pack" type="button"><span id="packName">无音效</span><span class="chev">▾</span></button>
    </div>
    <div class="menu hidden" id="menu"></div>
    <button class="alert hidden" id="permission" type="button"><span>打开辅助功能</span><span>↗</span></button>
    <div class="volume">
      <svg class="speaker" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.2 6.2h2L7.4 3.4v9.2L4.2 9.8h-2z"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M10 6.3a2.6 2.6 0 0 1 0 3.4M11.7 4.7a4.8 4.8 0 0 1 0 6.6"/></svg>
      <input id="volume" type="range" min="0" max="100" value="80">
      <div class="percent" id="percent">80</div>
    </div>
    <div class="row"><span>静音</span><span class="key">&#8997;&#8679;M</span><button class="switch" id="muted" type="button" role="switch" aria-checked="false"></button></div>
    <div class="hair"></div>
    <div class="row"><span>连击升调</span><button class="switch" id="combo" type="button" role="switch" aria-checked="true"></button></div>
    <div class="row"><span>通话时静音</span><button class="switch" id="smart" type="button" role="switch" aria-checked="true"></button></div>
    <div class="note hidden" id="suppress"></div>
    <div class="row"><span>开机自启</span><button class="switch" id="login" type="button" role="switch" aria-checked="false"></button></div>
    <div class="warn hidden" id="loginMessage"></div>
    <button class="link hidden" id="loginOpen" type="button">打开登录项</button>
    <div class="hair"></div>
    <div class="footer">
      <button class="action" id="import" type="button">添加音效包</button>
      <button class="action exit" id="quit" type="button">退出</button>
    </div>
  </div>
<script src="panel-ui.js"></script>
<script>
const ui = window.PlipPanelUI.create({
  get: (id) => document.getElementById(id),
  bridge: () => window.plip,
  onResize: (box) => {
    if (window.plip && window.plip.resize) window.plip.resize({ width: Math.ceil(box.width), height: Math.ceil(box.height) });
  },
  measure: () => document.querySelector(".panel").getBoundingClientRect()
});
ui.bind();
window.plipRender = (state) => ui.render(state);
if (window.__plipState) ui.render(window.__plipState);
if (window.plip && window.plip.ready) window.plip.ready();
</script>
</body>
</html>
