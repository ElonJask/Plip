<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plip</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f6;
    --card: #ffffff;
    --ink: #1d1d1f;
    --quiet: #6e6e73;
    --faint: #98989d;
    --line: rgba(0, 0, 0, .08);
    --fill: rgba(0, 0, 0, .05);
    --fill-strong: rgba(0, 0, 0, .09);
    --accent: #0a74ff;
    --accent-ink: #ffffff;
    --on: #30b350;
    --off: #c7c7cc;
    --warn: #b25b00;
    --warn-bg: #fff3e0;
    --danger: #d62f26;
    --shadow: 0 8px 28px rgba(0, 0, 0, .16);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --ink: #f5f5f7;
      --quiet: #a1a1a6;
      --faint: #76767b;
      --line: rgba(255, 255, 255, .09);
      --fill: rgba(255, 255, 255, .07);
      --fill-strong: rgba(255, 255, 255, .13);
      --accent: #3d8bff;
      --on: #32d74b;
      --off: #5a5a5f;
      --warn: #ffb454;
      --warn-bg: rgba(255, 159, 10, .16);
      --danger: #ff6961;
      --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font: 400 13px/1.35 var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hidden { display: none !important; }

  .panel {
    position: relative;
    width: 300px;
    padding: 14px 12px 10px;
    background: var(--bg);
  }

  /* 头部 */
  .header { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; }
  .logo {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(145deg, #4aa3ff, #0a60e6);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
  }
  .logo svg { width: 20px; height: 20px; }
  .title { min-width: 0; }
  .name { font-size: 15px; font-weight: 650; letter-spacing: .1px; }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 1px;
    font-size: 12px;
    color: var(--quiet);
  }
  .status::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--on);
  }
  .status.off::before { background: var(--faint); }
  .status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 权限提示 */
  .alert {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 9px 12px;
    border: 0;
    border-radius: var(--radius);
    background: var(--warn-bg);
    color: var(--warn);
    font-weight: 550;
    text-align: left;
  }
  .alert .grow { flex: 1; }
  .alert svg { width: 14px; height: 14px; flex: none; }

  /* 分组卡片 */
  .group {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 0 0 1px var(--line);
    margin-bottom: 10px;
  }
  .cell {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 8px 12px;
  }
  .cell + .cell, .cell + .extra, .extra + .cell { border-top: 1px solid var(--line); }
  .cell .text { flex: 1; min-width: 0; }
  .cell .label { font-weight: 500; }
  .cell .sub { margin-top: 1px; font-size: 12px; color: var(--quiet); }
  .kbd {
    flex: none;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--fill);
    color: var(--quiet);
    font-size: 11.5px;
    font-weight: 550;
    letter-spacing: .3px;
  }
  .extra { padding: 0 12px 10px; font-size: 12px; }
  .extra .warn { color: var(--warn); }
  .link { padding: 0; margin-top: 4px; border: 0; background: none; color: var(--accent); font-weight: 550; font-size: 12px; }

  /* 音效包选择 */
  .anchor { position: relative; flex: none; }
  .pack {
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: 160px;
    padding: 4px 8px 4px 10px;
    border: 0;
    border-radius: 7px;
    background: var(--fill);
    font-weight: 500;
  }
  .pack:hover { background: var(--fill-strong); }
  .pack span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pack svg { flex: none; width: 10px; height: 10px; color: var(--quiet); transition: transform .14s ease; }
  .pack[aria-expanded="true"] svg { transform: rotate(180deg); }
  .menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 5;
    width: 220px;
    max-height: 236px;
    overflow-y: auto;
    padding: 4px;
    border-radius: 10px;
    background: var(--card);
    box-shadow: 0 0 0 1px var(--line), var(--shadow);
  }
  .menu button {
    position: relative;
    display: block;
    width: 100%;
    padding: 6px 28px 6px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    font-weight: 450;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .menu button:hover { background: var(--accent); color: var(--accent-ink); }
  .menu button[aria-current="true"] { font-weight: 600; }
  .menu button[aria-current="true"]::after {
    content: "";
    position: absolute;
    right: 11px;
    top: 50%;
    width: 9px;
    height: 5px;
    margin-top: -4px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg);
  }

  /* 音量 */
  .volume { gap: 10px; }
  .speaker { flex: none; width: 16px; height: 16px; color: var(--quiet); }
  input[type="range"] {
    --pct: 80%;
    flex: 1;
    min-width: 0;
    height: 20px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--pct), var(--fill-strong) var(--pct));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .3);
  }
  .percent {
    width: 32px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--quiet);
    font-weight: 500;
  }

  /* 开关 */
  .switch {
    position: relative;
    flex: none;
    width: 36px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 11px;
    background: var(--off);
    transition: background .14s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    transition: transform .14s ease;
  }
  .switch[aria-checked="true"] { background: var(--on); }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }

  /* 底部 */
  .footer { display: flex; align-items: center; gap: 6px; padding: 0 2px; }
  .action {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-weight: 500;
  }
  .action:hover { background: var(--fill); }
  .action svg { width: 13px; height: 13px; color: var(--quiet); }
  .action.exit { margin-left: auto; color: var(--danger); }
  .action.exit svg { color: var(--danger); }

  /* 平台差异：智能静音依赖前台应用识别，仅 macOS 提供 */
  html[data-platform="other"] .mac-only { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="panel" id="root">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 10v0M6.5 6.5v7M10 3.5v13M13.5 7v6M17 10v0"/>
        </svg>
      </div>
      <div class="title">
        <div class="name">Plip</div>
        <div class="status" id="statusLine"><span id="status">正在监听按键</span></div>
      </div>
    </header>

    <button class="alert hidden" id="permission" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3M8 11.6v.1"/></svg>
      <span class="grow">需要「辅助功能」权限才能监听按键</span>
      <span>前往授权</span>
    </button>

    <section class="group" aria-label="声音">
      <div class="cell">
        <div class="text"><div class="label">音效包</div></div>
        <div class="anchor">
          <button class="pack" id="pack" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="packName">无音效</span>
            <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 3.5 3 3 3-3"/></svg>
          </button>
          <div class="menu hidden" id="menu" role="listbox" aria-label="音效包"></div>
        </div>
      </div>
      <div class="cell volume">
        <svg class="speaker" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.2 6.2h2L7.4 3.4v9.2L4.2 9.8h-2z"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M10 6.3a2.6 2.6 0 0 1 0 3.4M11.7 4.7a4.8 4.8 0 0 1 0 6.6"/></svg>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="音量">
        <div class="percent" id="percent">80</div>
      </div>
    </section>

    <section class="group" aria-label="行为">
      <div class="cell">
        <div class="text"><div class="label">静音</div></div>
        <span class="kbd" id="shortcut">⌥⇧M</span>
        <button class="switch" id="muted" type="button" role="switch" aria-checked="false" aria-label="静音"></button>
      </div>
      <div class="cell">
        <div class="text">
          <div class="label">连击升调</div>
          <div class="sub">连续敲击时音调逐渐升高</div>
        </div>
        <button class="switch" id="combo" type="button" role="switch" aria-checked="true" aria-label="连击升调"></button>
      </div>
      <div class="cell mac-only">
        <div class="text">
          <div class="label">通话时静音</div>
          <div class="sub">会议应用位于前台时暂停</div>
        </div>
        <button class="switch" id="smart" type="button" role="switch" aria-checked="true" aria-label="通话时静音"></button>
      </div>
      <div class="cell">
        <div class="text"><div class="label">开机自启</div></div>
        <button class="switch" id="login" type="button" role="switch" aria-checked="false" aria-label="开机自启"></button>
      </div>
      <div class="extra hidden" id="loginExtra">
        <div class="warn" id="loginMessage"></div>
        <button class="link mac-only" id="loginOpen" type="button">打开登录项设置</button>
      </div>
    </section>

    <footer class="footer">
      <button class="action" id="import" type="button">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10"/></svg>
        添加音效包
      </button>
      <button class="action exit" id="quit" type="button">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 1.8v5M3.9 3.9a4.6 4.6 0 1 0 6.2 0"/></svg>
        退出
      </button>
    </footer>
  </div>

<script src="panel-ui.js"></script>
<script>
  const isMac = /Mac/i.test(navigator.platform || navigator.userAgent);
  document.documentElement.dataset.platform = isMac ? "mac" : "other";
  document.getElementById("shortcut").textContent = isMac ? "⌥⇧M" : "Alt+Shift+M";

  const ui = window.PlipPanelUI.create({
    get: (id) => document.getElementById(id),
    bridge: () => window.plip,
    measure: () => document.getElementById("root").getBoundingClientRect(),
    onResize: (box) => {
      if (window.plip && window.plip.resize) {
        window.plip.resize({ width: Math.ceil(box.width), height: Math.ceil(box.height) });
      }
    }
  });
  ui.bind();
  document.addEventListener("pointerdown", (event) => ui.outsideClick(event.target));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") ui.escape();
  });
  window.plipRender = (state) => ui.render(state);
  if (window.__plipState) ui.render(window.__plipState);
  if (window.plip && window.plip.ready) window.plip.ready();
</script>
</body>
</html>
